# Lint rules for the project. See https://dart.dev/lints
include: package:flutter_lints/flutter.yaml

analyzer:
  exclude:
    # Generated code — not ours to lint or fix.
    - "**/*.g.dart"
    - "lib/generated/**"

linter:
  rules:
    - prefer_single_quotes
    - require_trailing_commas
    - avoid_print
