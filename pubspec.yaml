name: maly
description: "Maly - a simple offline debt tracker. Keep track of who owes you and who you owe."
publish_to: "none"

version: 1.0.0+1

environment:
  # A range, not an exact pin, so the project resolves on any Dart 3.8+ SDK.
  sdk: ">=3.8.1 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # State Management
  flutter_riverpod: ^2.6.1

  # Local Database
  drift: ^2.31.0
  drift_flutter: ^0.2.8

  # Navigation
  go_router: ^17.0.0

  # Local Notifications (payment reminders)
  flutter_local_notifications: ^20.1.0
  # zonedSchedule needs a real timezone database and the device's zone name
  timezone: ^0.10.0
  flutter_timezone: ^5.1.0

  # Persist small settings (theme + language)
  shared_preferences: ^2.5.3

  # Backup / restore: picks a save location and opens a backup file
  file_picker: ^10.3.10

  # Optional shortcut for filling in a person's name and phone
  flutter_contacts: ^1.1.9+2

  # Utilities / UI
  intl: ^0.20.2
  flutter_slidable: ^4.0.3

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^5.0.0

  # Drift code generation
  build_runner: ^2.15.1
  drift_dev: ^2.31.0

  # App icon generation
  flutter_launcher_icons: ^0.14.3

flutter:
  uses-material-design: true

  # Enables gen-l10n code generation (configured in l10n.yaml)
  generate: true

flutter_launcher_icons:
  # Generate icons for both Android and iOS.
  android: true
  ios: true
  # Path is relative to the project root.
  image_path: "assets/logo.jpg"
  # Adaptive icon for Android 8+ (foreground on white background).
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: "assets/logo.jpg"
  # Remove the old icon on iOS if the name changed.
  remove_alpha_ios: true
