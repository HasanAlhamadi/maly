name: maly
description: "Maly - a simple offline debt tracker. Keep track of who owes you and who you owe."
publish_to: "none"

version: 1.0.0+1

environment:
  # A range, not an exact pin, so the project resolves on any Dart 3.8+ SDK.
  sdk: ">=3.8.1 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # State Management
  flutter_riverpod: ^2.6.1

  # Local Database
  drift: ^2.31.0
  drift_flutter: ^0.2.8

  # Navigation
  go_router: ^17.0.0

  # Local Notifications
  flutter_local_notifications: ^20.1.0

  # Persist small settings (theme + language)
  shared_preferences: ^2.5.3

  # Utilities / UI
  intl: ^0.20.2
  flutter_slidable: ^4.0.3

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^5.0.0

  # Drift code generation
  build_runner: ^2.15.1
  drift_dev: ^2.31.0

flutter:
  uses-material-design: true

  # Enables gen-l10n code generation (configured in l10n.yaml)
  generate: true
